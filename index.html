<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sueños">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Sueños</title>
<style>
:root{
  --bg0:#030816; --bg1:#061235; --bg2:#0d2257;
  --card:rgba(120,160,255,.065); --card2:rgba(120,160,255,.11);
  --stroke:rgba(150,190,255,.14); --stroke2:rgba(150,190,255,.28);
  --text:#e8f0ff; --muted:#8fa3c8; --dim:#5d7096;
  --accent:#5b9dff; --accent2:#7dd3fc; --indigo:#6366f1; --ice:#e2e8f0;
  --ok:#7dd3fc; --warn:#fbbf24; --bad:#fb7185;
  --r:22px; --rs:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--text)}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 70% at 50% -10%,var(--bg2) 0%,var(--bg1) 45%,var(--bg0) 100%) fixed;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  -webkit-user-select:none; user-select:none;
}
textarea,input{-webkit-user-select:text;user-select:text}
h1,h2,h3,.round{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(60px);opacity:.35}
.nebula.a{width:60vw;height:60vw;left:-15vw;top:8vh;background:#1d4ed8;animation:drift 22s ease-in-out infinite alternate}
.nebula.b{width:55vw;height:55vw;right:-20vw;top:45vh;background:#4338ca;opacity:.25;animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.15)}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 110px)}
#view.enter>*{animation:rise .5s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}
#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(5){animation-delay:.2s}
#view.enter>*:nth-child(6){animation-delay:.25s}#view.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Generic ---------- */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:18px;margin:0 0 14px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{appearance:none;border:1px solid var(--stroke2);background:var(--card2);color:var(--text);font:inherit;font-weight:600;
  padding:12px 16px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 8px 24px rgba(59,130,246,.35)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.btn.block{width:100%}.btn.big{padding:16px;font-size:17px;border-radius:18px}
.icon-btn{appearance:none;border:1px solid var(--stroke);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.top h1{margin:0;font-size:26px}.top p{margin:0;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--stroke)}
.pill.lucid{background:linear-gradient(135deg,rgba(125,211,252,.25),rgba(99,102,241,.3));border-color:rgba(125,211,252,.5);color:#dff4ff}
.pill.casi{background:rgba(125,211,252,.1);color:var(--accent2)}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 4px 10px;font-weight:700}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{display:block;margin:0 auto 10px;width:40px;height:40px;color:var(--dim)}.empty .big svg{width:40px;height:40px}
a{color:var(--accent2)}

/* ---------- Home ---------- */
.hello h1{font-size:30px;margin:6px 0 2px}
.hello p{margin:0 0 18px;color:var(--muted)}
.cta{position:relative;overflow:hidden;text-align:center;padding:26px 18px 22px;cursor:pointer;
  background:linear-gradient(160deg,rgba(59,130,246,.22),rgba(99,102,241,.12) 60%,rgba(125,211,252,.08));border-color:rgba(125,211,252,.25)}
.cta h2{margin:16px 0 4px;font-size:21px}.cta p{margin:0;color:var(--muted);font-size:14px}
.orb{position:relative;width:96px;height:96px;margin:0 auto;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#93c5fd,#3b82f6 45%,#4338ca 100%);
  box-shadow:0 0 0 8px rgba(91,157,255,.12),0 0 50px rgba(91,157,255,.55),inset 0 -8px 20px rgba(30,27,75,.5);animation:breathe 3.2s ease-in-out infinite}
.orb svg{width:38px;height:38px;position:relative;z-index:2}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 0 14px rgba(91,157,255,.08),0 0 70px rgba(91,157,255,.7),inset 0 -8px 20px rgba(30,27,75,.5)}}
.orb.lg{width:132px;height:132px}.orb.lg svg{width:50px;height:50px}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(125,211,252,.6);opacity:0}
.orb.on{animation:none;background:radial-gradient(circle at 35% 30%,#bae6fd,#38bdf8 40%,#2563eb 100%)}
.orb.on .ring{animation:ripple 2s ease-out infinite}.orb.on .ring:nth-child(2){animation-delay:.66s}.orb.on .ring:nth-child(3){animation-delay:1.33s}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
.today-done{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.today-done .check svg{width:22px;height:22px}
.today-done .check.none{background:rgba(150,190,255,.1);color:var(--muted)}
.today-done .check{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,rgba(125,211,252,.3),rgba(99,102,241,.35))}
.today-done h2{margin:0 0 4px;font-size:19px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.streak{display:flex;align-items:center;gap:16px}
.streak .num{font:700 44px/1 ui-rounded,-apple-system,sans-serif;background:linear-gradient(180deg,#fff,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.week{display:flex;gap:6px;margin-top:14px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--dim)}
.week i{display:block;height:30px;border-radius:9px;margin-bottom:4px;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.week i.on{background:linear-gradient(180deg,#60a5fa,#4f46e5);border-color:transparent;box-shadow:0 4px 14px rgba(79,70,229,.4)}
.week i.lu{background:linear-gradient(180deg,#a5f3fc,#38bdf8);box-shadow:0 4px 14px rgba(56,189,248,.5)}
.week i.none{background:rgba(150,190,255,.16);border-color:transparent}
.week i.today{outline:2px solid rgba(125,211,252,.5);outline-offset:2px}
.ringwrap{position:relative;width:58px;height:58px;flex:none}
.ringwrap svg{width:58px;height:58px;transform:rotate(-90deg)}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.tip{display:flex;gap:12px}.tip .e{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--accent2)}.tip .e svg{width:18px;height:18px}

/* ---------- Sleep ---------- */
.sleep-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}
.sleep-head .big{font:700 32px/1 ui-rounded,-apple-system,sans-serif}
.hyp{width:100%;height:auto;display:block;margin:6px 0 4px;overflow:visible}
.hyp .guide{stroke:rgba(150,190,255,.08);stroke-width:1}
.hyp .tick{stroke:rgba(150,190,255,.1);stroke-dasharray:2 4}
.hyp .lab{fill:#8fa3c8;font-size:10.5px;font-weight:600}
.hyp .hr{fill:#5d7096;font-size:10px}
.hyp .conn{fill:none;stroke:rgba(200,220,255,.28);stroke-width:1.2}
.stages{display:grid;gap:9px;margin-top:10px}
.stage{display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.stage .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}
.stage .bar i{display:block;height:100%;border-radius:9px;width:var(--w);animation:grow 1s var(--ease) both .3s}
@keyframes grow{from{width:0}}
.stage .v{white-space:nowrap;font-size:12.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

/* ---------- New dream ---------- */
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px}
.rec-area{text-align:center;margin:8px 0 18px}
.rec-area .status{margin:14px 0 0;color:var(--muted);font-size:14px;min-height:20px}
.bars{display:flex;justify-content:center;gap:4px;height:22px;margin-top:10px;opacity:0;transition:opacity .3s}
.bars.on{opacity:1}
.bars i{width:4px;border-radius:4px;background:var(--accent2);animation:wave 1s ease-in-out infinite}
.bars i:nth-child(2n){animation-delay:.2s}.bars i:nth-child(3n){animation-delay:.4s}.bars i:nth-child(4n){animation-delay:.1s}
@keyframes wave{0%,100%{height:5px}50%{height:22px}}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 7px 4px;font-weight:600}
textarea,.input{width:100%;font:inherit;font-size:17px;color:var(--text);background:rgba(4,10,30,.55);border:1px solid var(--stroke);border-radius:var(--rs);padding:14px;outline:none;transition:border .2s,box-shadow .2s}
textarea{min-height:170px;resize:none;line-height:1.55}
textarea:focus,.input:focus{border-color:rgba(125,211,252,.55);box-shadow:0 0 0 4px rgba(125,211,252,.1)}
textarea::placeholder,.input::placeholder{color:var(--dim)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;background:rgba(4,10,30,.55);border:1px solid var(--stroke);border-radius:16px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 4px;border-radius:12px;cursor:pointer;transition:all .25s var(--ease)}
.seg button.on{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--stroke);background:rgba(4,10,30,.5);color:var(--text);font:inherit;font-size:14.5px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:all .2s}
.chip.on{background:rgba(91,157,255,.22);border-color:rgba(125,211,252,.6);transform:translateY(-1px)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- Diary ---------- */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--dim)}
.search .input{padding-left:42px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.dream{display:flex;gap:14px;align-items:flex-start;cursor:pointer;padding:15px}
.dream:active{transform:scale(.985)}
.dream.none{opacity:.62}.dream.none .datebox{background:rgba(255,255,255,.04)}
.datebox{flex:none;width:52px;text-align:center;padding:8px 0;border-radius:14px;background:linear-gradient(180deg,rgba(91,157,255,.22),rgba(99,102,241,.12));border:1px solid var(--stroke)}
.datebox b{display:block;font:700 21px/1.05 ui-rounded,-apple-system,sans-serif}
.datebox span{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.dream h3{margin:0 0 3px;font-size:16.5px;color:var(--text)}
.dream p{margin:0 0 7px;font-size:14px;color:var(--muted)}
.dream .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}

/* ---------- Detail ---------- */
.detail h1{font-size:28px;margin:0 0 6px;line-height:1.15}
.detail .when{color:var(--muted);font-size:14.5px;margin-bottom:12px}
.dream-text{font-size:17px;line-height:1.65;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
mark{background:rgba(125,211,252,.2);color:#dff4ff;border-radius:5px;padding:0 3px}

/* ---------- Lucid ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;background:rgba(4,10,30,.55);border:1px solid var(--stroke);border-radius:16px;margin-bottom:16px;position:sticky;top:calc(var(--safe-t) + 6px);z-index:5;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;padding:9px 2px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--stroke2)}
.phase{background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(59,130,246,.12));border-color:rgba(165,180,252,.3)}
.phase .lvl{display:flex;gap:6px;margin-top:12px}
.phase .lvl i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.1)}
.phase .lvl i.on{background:linear-gradient(90deg,#7dd3fc,#818cf8)}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--stroke)}
.task:last-child{border-bottom:0}
.tcheck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--stroke2);display:grid;place-items:center;cursor:pointer;transition:all .25s var(--ease);background:transparent;color:transparent;padding:0}
.tcheck.on{background:linear-gradient(135deg,#38bdf8,#6366f1);border-color:transparent;color:#fff;transform:scale(1.06)}
.tcheck svg{width:16px;height:16px}
.task .tt{font-weight:600}.task .when{font-size:11.5px;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.task details{margin-top:4px}.task summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.task summary::-webkit-details-marker{display:none}
.task .how{font-size:14px;color:#c9d6f0;margin:8px 0 4px}
.src{font-size:12px;color:var(--dim);font-style:italic}
.tech{padding:0;overflow:hidden}
.tech summary{list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:center;cursor:pointer}
.tech summary::-webkit-details-marker{display:none}
.tech summary .e{font-size:26px;flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card2)}
.tech summary h3{margin:0;color:var(--text);font-size:16.5px}
.tech summary p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tech summary .chev{margin-left:auto;transition:transform .3s;color:var(--dim)}
.tech[open] summary .chev{transform:rotate(90deg)}
.tech .body{padding:0 18px 18px;font-size:15px;color:#c9d6f0;animation:fade .4s}
.tech .body ol,.tech .body ul{padding-left:20px;margin:8px 0}.tech .body li{margin:5px 0}
.tech .body .stat{display:flex;gap:10px;align-items:center;background:rgba(125,211,252,.07);border:1px solid rgba(125,211,252,.18);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.tech .body .stat b{font:700 22px/1 ui-rounded,-apple-system,sans-serif;color:var(--accent2);flex:none}
.wordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--stroke)}
.wordrow:last-child{border-bottom:0}
.wordrow .w{font-weight:600;flex:1}.wordrow .c{color:var(--muted);font-size:13px}
.sign{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:999px;background:rgba(125,211,252,.13);border:1px solid rgba(125,211,252,.35);font-size:14.5px}
.sign button{appearance:none;border:0;background:rgba(255,255,255,.1);color:var(--text);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.statgrid .card{margin:0;padding:15px}
.statgrid .n{font:700 30px/1.05 ui-rounded,-apple-system,sans-serif}
.statgrid .l{font-size:12.5px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:7px;height:130px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart .stack{width:100%;max-width:30px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart .b{width:100%;border-radius:7px 7px 3px 3px;animation:up .9s var(--ease) both}
.chart .b+.b{border-radius:3px}
@keyframes up{from{transform:scaleY(0);transform-origin:bottom}}
.chart .x{font-size:10.5px;color:var(--dim);white-space:nowrap}
.chart .v{font-size:10.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:110px 1fr 32px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .bar{height:10px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden}
.hbar .bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#3b82f6,#7dd3fc);border-radius:10px;animation:grow 1s var(--ease) both .2s}

/* ---------- Settings ---------- */
.switch{position:relative;flex:none;width:52px;height:32px;border-radius:32px;background:rgba(255,255,255,.12);border:0;cursor:pointer;transition:background .25s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.switch.on{background:linear-gradient(135deg,#38bdf8,#6366f1)}.switch.on::after{transform:translateX(20px)}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.ob-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}.ob-dots i.on{background:var(--accent2);width:20px;border-radius:7px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--stroke)}
.set-row:last-child{border-bottom:0}
.set-row .t{font-weight:600}.set-row .s{font-size:13px;color:var(--muted)}
.steps{counter-reset:s;padding:0;margin:8px 0 0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 36px;font-size:14.5px;color:#c9d6f0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;background:var(--card2);border:1px solid var(--stroke2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--accent2)}
code{background:rgba(125,211,252,.12);padding:1px 6px;border-radius:6px;font-size:13.5px;color:#dff4ff}

/* ---------- Tab bar ---------- */
#tabbar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 10px);width:min(94vw,520px);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 6px;border-radius:26px;
  background:rgba(8,18,48,.72);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 12px 40px rgba(0,0,0,.45)}
#tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);text-decoration:none;font-size:10.5px;font-weight:600;padding:5px 0;transition:color .2s}
#tabbar a svg{width:23px;height:23px;transition:transform .3s var(--ease)}
#tabbar a.on{color:var(--text)}#tabbar a.on svg{transform:translateY(-2px);color:var(--accent2)}
#tabbar a.mic{margin-top:-30px}
#tabbar a.mic span.o{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 30%,#93c5fd,#3b82f6 50%,#4338ca);box-shadow:0 0 0 5px rgba(3,8,22,.9),0 8px 26px rgba(59,130,246,.6)}
#tabbar a.mic svg{width:26px;height:26px;color:#fff!important;transform:none!important}
body.hide-tabs #tabbar{transform:translate(-50%,140%);transition:transform .3s}

/* ---------- Sheet / modal ---------- */
#sheetBg{position:fixed;inset:0;z-index:40;background:rgba(1,4,14,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(100vw,560px);max-height:88vh;overflow:auto;transform:translate(-50%,105%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s;
  background:linear-gradient(180deg,#0e1f4f,#071433);border:1px solid var(--stroke2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--safe-b) + 22px);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
#sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .42s var(--ease),visibility 0s}
#sheet .grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 14px}
#sheet h2{margin:4px 0 8px;font-size:22px}
#sheet p{color:#c9d6f0}
#toast{position:fixed;z-index:60;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-150%);transition:transform .4s var(--ease);
  background:rgba(14,31,79,.95);border:1px solid var(--stroke2);padding:11px 18px;border-radius:16px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}

/* ---------- Lock ---------- */
#lock{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:radial-gradient(120% 70% at 50% -10%,#0d2257 0%,#061235 45%,#030816 100%);padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px)}
#lock[hidden]{display:none}
#lock .moon{width:74px;height:74px;border-radius:50%;box-shadow:inset -18px -6px 0 0 #dbeafe;transform:rotate(-20deg);margin-bottom:10px;filter:drop-shadow(0 0 22px rgba(147,197,253,.6))}
#lock h2{margin:0;font-size:26px}
.dots{display:flex;gap:16px;margin:18px 0 26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(200,220,255,.5);transition:all .2s}
.dots i.on{background:#93c5fd;border-color:#93c5fd;box-shadow:0 0 12px #60a5fa}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.pad button{appearance:none;width:76px;height:76px;border-radius:50%;border:1px solid var(--stroke);background:rgba(120,160,255,.08);color:var(--text);font:500 28px/1 ui-rounded,-apple-system,sans-serif;cursor:pointer;transition:background .15s,transform .1s}
.pad button:active{background:rgba(120,160,255,.25);transform:scale(.94)}
.pad button.blank{visibility:hidden}.pad button.del{font-size:20px;border-color:transparent;background:transparent}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;margin-top:18px;cursor:pointer;text-decoration:underline}

/* ---------- Celebration ---------- */
.burst{position:fixed;z-index:70;left:50%;top:45%;pointer-events:none}
.burst i{position:absolute;width:8px;height:8px;border-radius:50%;background:#bfdbfe;box-shadow:0 0 10px #60a5fa;animation:fly 1.1s var(--ease) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.saved-msg{position:fixed;z-index:70;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:pop 1.3s var(--ease) forwards}
.saved-msg .mini-moon{width:46px;height:46px;border-radius:50%;box-shadow:inset -12px -4px 0 0 #dbeafe;margin:0 auto 12px;transform:rotate(-20deg);filter:drop-shadow(0 0 16px rgba(147,197,253,.7))}.saved-msg b{font:700 22px ui-rounded,-apple-system,sans-serif}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ===== v1.2 ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(120% 70% at 50% -10%,#0d2257 0%,#061235 45%,#030816 100%);transition:opacity .5s ease,visibility 0s .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .sm{width:84px;height:84px;border-radius:50%;box-shadow:inset -20px -7px 0 0 #dbeafe;transform:rotate(-20deg);filter:drop-shadow(0 0 26px rgba(147,197,253,.75));animation:moonIn 1s var(--ease) both}
#splash b{font:700 28px ui-rounded,-apple-system,sans-serif;letter-spacing:.01em;animation:rise .8s var(--ease) .25s both}
@keyframes moonIn{from{opacity:0;transform:translateY(26px) rotate(-60deg) scale(.7)}to{opacity:1;transform:rotate(-20deg)}}
#view.enter-r>*{animation:inR .48s var(--ease) both}
#view.enter-l>*{animation:inL .48s var(--ease) both}
#view.enter-r>*:nth-child(2),#view.enter-l>*:nth-child(2){animation-delay:.04s}
#view.enter-r>*:nth-child(3),#view.enter-l>*:nth-child(3){animation-delay:.08s}
#view.enter-r>*:nth-child(4),#view.enter-l>*:nth-child(4){animation-delay:.12s}
#view.enter-r>*:nth-child(5),#view.enter-l>*:nth-child(5){animation-delay:.16s}
#view.enter-r>*:nth-child(n+6),#view.enter-l>*:nth-child(n+6){animation-delay:.2s}
@keyframes inR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.card[data-act]{transition:transform .18s var(--ease)}.card[data-act]:active{transform:scale(.985)}
#sheet{transition:transform .5s cubic-bezier(.2,1.08,.3,1),visibility 0s .5s}
.orb.on.talk{transform:scale(1.06);box-shadow:0 0 0 10px rgba(125,211,252,.16),0 0 80px rgba(56,189,248,.8)}
.orb.on{transition:transform .25s var(--ease),box-shadow .25s}
.orb.on.talk .ring{animation-duration:1.1s}
.bars.talk i{animation-duration:.42s}
.bars i{height:5px}
/* Partes */
.part{border:1px solid var(--stroke);border-radius:var(--r);padding:14px;margin-bottom:12px;background:rgba(4,10,30,.35);transition:border-color .25s,box-shadow .25s;animation:rise .4s var(--ease) both}
.part.active{border-color:rgba(125,211,252,.45);box-shadow:0 0 0 4px rgba(125,211,252,.07)}
.part-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
.part-h .t{flex:1}.part-h .tm{font-size:13px;color:var(--muted);font-weight:600}
.part-h .x{appearance:none;border:0;background:rgba(255,255,255,.07);color:var(--muted);width:28px;height:28px;border-radius:9px;cursor:pointer}
.part.collapsed{cursor:pointer;padding:12px 14px}.part.collapsed .part-h{margin:0}
.part.collapsed .snip{font-size:14px;color:var(--muted);margin-top:4px}
.part textarea{min-height:130px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sugg .lbl{font-size:12px;color:var(--dim);margin-right:2px}
.chip.s{border-style:dashed;color:var(--accent2);font-size:13.5px;padding:6px 11px}
.chip.theme.on{background:rgba(99,102,241,.25);border-color:rgba(165,180,252,.6)}
.ptl{position:relative;padding-left:18px;margin-bottom:12px}
.ptl::before{content:"";position:absolute;left:5px;top:22px;bottom:-14px;width:2px;background:linear-gradient(180deg,rgba(125,211,252,.4),rgba(125,211,252,0))}
.ptl:last-child::before{display:none}
.ptl .dotp{position:absolute;left:0;top:17px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#7dd3fc,#6366f1);box-shadow:0 0 10px rgba(125,211,252,.6)}
.ptl .card{margin:0}
.ptl .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted);font-weight:700}
/* Voz */
.listen{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--stroke2);background:var(--card2);color:var(--text);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.listen svg{width:17px;height:17px}
.listen.on{background:linear-gradient(135deg,#38bdf8,#6366f1);border-color:transparent}
.listen .eq{display:none;gap:2px;align-items:flex-end;height:14px}.listen.on .eq{display:inline-flex}.listen.on .ic{display:none}
.listen .eq i{width:3px;background:#fff;border-radius:2px;animation:wave .8s ease-in-out infinite}.listen .eq i:nth-child(2){animation-delay:.2s}.listen .eq i:nth-child(3){animation-delay:.4s}
select.input{appearance:none;-webkit-appearance:none;font-size:16px;padding:10px 12px}
input[type=range]{width:100%;accent-color:#60a5fa}
.miss{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.06)}
</style>
</head>

<script>
'use strict';
/* =========================================================
   Sueños · diario de sueños para sueños lúcidos
   Todo se guarda solo en este iPhone (localStorage).
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const KEY = 'suenos.v1';
const VERSION = '1.2';

/* ---------- Datos ---------- */
const DEFAULT = () => ({
  v: 2, name: '', dreams: {}, sleep: {}, plan: {}, signs: [], draft: null, pendingImport: 0, importTarget: null, welcomed: false,
  settings: { pinHash: null, shortcut: 'Sueños Salud', health: false, autoImport: true, voice: '', rate: 1,
    rc: { n: 5, from: 10, to: 22, msg: '¿Estás soñando?', added: null, wanted: false } }
});
let DB;
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
  DB = Object.assign(DEFAULT(), raw || {});
  DB.settings = Object.assign(DEFAULT().settings, (raw && raw.settings) || {});
  DB.settings.rc = Object.assign(DEFAULT().settings.rc, (raw && raw.settings && raw.settings.rc) || {});
  // Usuarios de la v1.0: si ya habían traído datos de Salud, se deja activado
  if (raw && raw.settings && raw.settings.health === undefined) DB.settings.health = Object.keys(DB.sleep || {}).length > 0;
  migrate();
}
// v1.2: cada sueño pasa a tener "partes" (una por cada vez que te despiertas)
function migrate() {
  for (const d of Object.values(DB.dreams)) {
    if (d.kind) continue;
    if (!Array.isArray(d.parts)) d.parts = [{ id: 'p1', at: d.recordedAt || null, text: d.text || '', lucid: d.lucid || null, emotions: d.emotions || [] }];
    if (!Array.isArray(d.tags)) d.tags = [];
  }
  if (DB.draft && !Array.isArray(DB.draft.parts)) DB.draft = null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('No se pudo guardar: ' + e.message); }
}

/* ---------- Utilidades de fecha ---------- */
const pad = (n) => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);
const hm = (d) => { d = new Date(d); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIAS_C = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const longDate = (k) => { const d = fromKey(k); return `${cap(DIAS[d.getDay()])}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const shortDate = (k) => { const d = fromKey(k); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const fullDate = (k) => { const d = fromKey(k); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const dur = (m) => { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${pad(r)}m` : `${r} min`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* ---------- Catálogos ---------- */
const EMOS = [
  ['alegria', '😊', 'Alegría'], ['miedo', '😨', 'Miedo'], ['raro', '🌀', 'Raro'], ['calma', '😌', 'Calma'],
  ['tristeza', '😢', 'Tristeza'], ['enfado', '😠', 'Enfado'], ['amor', '💙', 'Amor'],
  ['verguenza', '😳', 'Vergüenza'], ['pesadilla', '😱', 'Pesadilla']
];
const EMO = Object.fromEntries(EMOS.map(([id, e, n]) => [id, { e, n }]));
const LUCID = { si: 'Lúcido', casi: 'Casi lúcido', no: 'No lúcido' };
const KIND = { olvido: 'No recordé el sueño', nada: 'Noche sin sueños' };
const isReal = (d) => !!d && !d.kind;
const realCount = () => Object.values(DB.dreams).filter(isReal).length;
const LUCID_RANK = { si: 3, casi: 2, no: 1 };
// Rellena los campos generales del sueño a partir de sus partes
function deriveDream(d) {
  const ps = d.parts.filter((p) => p.text && p.text.trim());
  d.text = ps.map((p) => p.text.trim()).join('\n\n');
  d.lucid = ps.reduce((b, p) => ((LUCID_RANK[p.lucid] || 0) > (LUCID_RANK[b] || 0) ? p.lucid : b), null);
  d.emotions = [...new Set(ps.flatMap((p) => p.emotions || []))];
  d.recordedAt = (ps.find((p) => p.at) || {}).at || d.recordedAt || null;
  return d;
}

/* ---------- Detector de emociones y temas (sin IA externa, todo en el móvil) ---------- */
const EMO_RX = {
  miedo: /\b(miedo|asust|terror|aterr|panico|pavor|horror|angusti|temblaba|nervios)/,
  alegria: /\b(feliz|felic|alegr|content[oa]s?\b|divert|disfrut|riendo|reia|reiamos|risas?\b|genial|emocionad)/,
  tristeza: /\b(trist|llor|pena\b|deprim|melancol|nostalg|echaba de menos)/,
  enfado: /\b(enfad|cabre|rabia|furios|odiaba|enoj|discut|pele(a|aba|abamos|ando)\b)/,
  calma: /\b(tranquil|calma\b|en paz|relaj|seren|a gusto)/,
  amor: /\b(amor\b|enamor|bes(o|os|aba|abamos|ar)\b|abraz|carin|romant)/,
  verguenza: /\b(verguenz|avergonz|ridicul|desnud)/,
  raro: /\b(rar[oa]s?\b|extran|imposible|absurd|surreal|de repente|sin sentido|magia|magic|transform|se convirti)/
};
const THEMES = [
  ['volar', 'Volar', /\bvol(ar|aba|abas|aban|abamos|e|o|amos|ando|ado)\b|\bflot/],
  ['caer', 'Caer', /\b(cai|caia|caian|caer|cayendo|cayo|caida|precipicio)\b/],
  ['persecucion', 'Persecución', /\b(perseg|persigu|huir\b|huia|huiamos|escap)/],
  ['agua', 'Agua o mar', /\b(agua|mar|playa|piscina|nad(ar|aba|ando|abamos)|rio|lago|olas?|inund\w*|lluvia|oceano)\b/],
  ['estudios', 'Clase o examen', /\b(colegio|instituto|insti|clase|profe|profesor|profesora|examen|universidad|deberes)\b/],
  ['familia', 'Familia', /\b(madre|padre|mama|papa|herman|abuel|prim[oa]s?\b|tio\b|tia\b|famili)/],
  ['pareja', 'Pareja', /\b(novi[oa]|pareja)\b/],
  ['amigos', 'Amigos', /\bamig/],
  ['animales', 'Animales', /\b(perros?|gatos?|caballo|serpiente|arana|pajaro|animal\w*|lobo|leon|tiburon|peces|pez)\b/],
  ['casa', 'Casa', /\b(casa|habitacion|cuarto|salon|cocina|piso)\b/],
  ['viaje', 'Viaje o vehículo', /\b(coche|avion|tren|autobus|moto|viaj|conduc)/],
  ['muerte', 'Muerte', /\b(muert|morir|moria|fallec|funeral|cementerio)/],
  ['dientes', 'Dientes', /\b(dientes?|muelas?)\b/],
  ['perderse', 'Perderse o llegar tarde', /\b(me perdi|perdido|perdida|perdiendo|llegar tarde|llegaba tarde|no encontraba)/],

function streak() {

  let n = 0;
  while (DB.dreams[dkey(d)]) { n++; d = addDays(d, -1); }

}
function bestStreak() {

/* ---------- Gráfico de fases (hipnograma) ---------- */
function hypno(sl, compact = false) {
  const rows = sl.hasStages ? ['w', 'r', 'l', 'd'] : ['w', 'a'];
  const W = 340, L = compact ? 4 : 64, R = 6, top = 6, rowH = compact ? 20 : 27;
  const H = top + rows.length * rowH + (compact ? 4 : 22);
  const span = Math.max(1, sl.span);
  const X = (m) => L + (m / span) * (W - L - R);
  const Y = (c) => top + rows.indexOf(c) * rowH + rowH / 2;
  const id = 'cp' + Math.random().toString(36).slice(2, 8);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="hyp" role="img" aria-label="Fases del sueño"><defs><clipPath id="${id}"><rect x="0" y="0" width="0" height="${H}"><animate attributeName="width" from="0" to="${W}" dur="1.2s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 0 .2 1"/></rect></clipPath></defs>`;
  rows.forEach((c) => { const y = Y(c); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="guide"/>`; if (!compact) s += `<text x="0" y="${y + 4}" class="lab">${ST[c].n}</text>`; });
  if (!compact) {
    const bed = new Date(sl.bed), wake = new Date(sl.wake); const t = new Date(bed); t.setMinutes(0, 0, 0); t.setHours(t.getHours() + 1);
    while (t < wake) { const x = X((t - bed) / 6e4); s += `<line x1="${x}" x2="${x}" y1="${top}" y2="${H - 18}" class="tick"/><text x="${x}" y="${H - 4}" class="hr" text-anchor="middle">${pad(t.getHours())}h</text>`; t.setHours(t.getHours() + 1); }
  }
  let path = '';
  sl.seg.forEach(([o, len, c], i) => { const y = Y(c); path += (i ? `L${X(o).toFixed(1)},${y}` : `M${X(o).toFixed(1)},${y}`) + `L${X(o + len).toFixed(1)},${y}`; });
  s += `<g clip-path="url(#${id})"><path d="${path}" class="conn"/>`;
  const bh = compact ? 9 : 12;
  sl.seg.forEach(([o, len, c]) => { if (rows.indexOf(c) < 0) return; s += `<rect x="${X(o).toFixed(1)}" y="${Y(c) - bh / 2}" width="${Math.max(1.4, X(o + len) - X(o)).toFixed(1)}" height="${bh}" rx="3" fill="${ST[c].c}"/>`; });
  return s + '</g></svg>';
}
function stageBars(sl) {
  const order = sl.hasStages ? ['r', 'd', 'l', 'w'] : ['a', 'w'];
  const tot = Object.values(sl.st).reduce((a, b) => a + b, 0) || 1;
  return `<div class="stages">${order.filter((c) => sl.st[c] != null).map((c) => {
    const p = Math.round((sl.st[c] / tot) * 100);
    return `<div class="stage"><span><i class="dot" style="background:${ST[c].c}"></i>${ST[c].n}</span><div class="bar"><i style="--w:${p}%;background:${ST[c].c}"></i></div><span class="v">${dur(sl.st[c])} · ${p}%</span></div>`;
  }).join('')}</div>`;
}

/* ---------- Parser de datos de Salud (Atajo) ---------- */
const MES_ABBR = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MON_EN = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  if (m) { let [, d, mo, y, h, mi, se, ap] = m; y = +y; if (y < 100) y += 2000; h = +h; if (ap) { const p = /p/i.test(ap); if (p && h < 12) h += 12; if (!p && h === 12) h = 0; } return new Date(y, mo - 1, +d, h, +mi, +(se || 0)); }

  if (m) { const mi = monthIdx(m[2]); if (mi >= 0) { let h = +m[4]; if (m[7]) { const p = /p/i.test(m[7]); if (p && h < 12) h += 12; if (!p && h === 12) h = 0; } return new Date(+m[3], mi, +m[1], h, +m[5], +(m[6] || 0)); } }
  m = s.match(/^([A-Za-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})(?:,|\s+at)?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?\s?m\.?)?/i);
  if (m) { const mi = monthIdx(m[1]); if (mi >= 0) { let h = +m[4]; if (m[7]) { const p = /p/i.test(m[7]); if (p && h < 12) h += 12; if (!p && h === 12) h = 0; } return new Date(+m[3], mi, +m[2], h, +m[5], +(m[6] || 0)); } }

  const t = norm(v).trim();

  if (/\brem\b/.test(t)) return 'r';
  if (/profund|deep/.test(t)) return 'd';
  if (/basic|core|ligero|light|nucleo|principal|central/.test(t)) return 'l';
  if (/despiert|awake|vigilia/.test(t)) return 'w';

function parseHealth(text, target) {

  let samples = [];

    const parts = line.split(/\s*[|;\t]\s*/).filter(Boolean);
    if (parts.length < 3) continue;

    parts.forEach((p) => { const d = parseDate(p); if (d) dates.push(d); else other.push(p); });
    if (dates.length < 2 || !other.length) continue;
    const st = mapStage(other[0]);
    if (!st) continue;

    if (e - s < 30000) continue;
    samples.push({ s, e, st, src: norm(other.slice(1).join(' ')) });
  }
  if (!samples.length) return { error: 'No he encontrado datos de sueño en lo que has pegado.' };
  // Si hay datos de Zepp, usar solo esos
  if (samples.some((x) => x.src.includes('zepp'))) samples = samples.filter((x) => x.src.includes('zepp'));
  // Si hay fases o "dormido", ignorar "en cama"

  if (target) { const m = pool.find((gr) => dkey(new Date(gr.end)) === target); if (!m) return { error: 'missing', latest: dkey(new Date(pool[0].end)) }; G = m; }

  }
  let first = tl.findIndex((v) => v && v !== 'w'), last = -1;
  for (let i = n - 1; i >= 0; i--) if (tl[i] && tl[i] !== 'w') { last = i; break; }

  const seg = []; const st = {};
  for (let i = first; i <= last; i++) {
    const c = tl[i] || 'w';
    st[c] = (st[c] || 0) + 1;
    const lastSeg = seg[seg.length - 1];

  }

  if (hasStages && st.a) { st.l = (st.l || 0) + st.a; delete st.a; seg.forEach((x) => { if (x[2] === 'a') x[2] = 'l'; }); }
  const total = (st.r || 0) + (st.d || 0) + (st.l || 0) + (st.a || 0);

}

/* ---- Dictado por voz ----
   El reconocimiento de voz web del iPhone no pone puntuación y trata cada pausa como frase nueva.
   Aquí se arregla: minúscula al continuar una frase, punto tras una pausa larga y comandos de voz

    .replace(/\s+(signo de interrogaci[oó]n|cierra(r)? (la )?interrogaci[oó]n)\b/gi, '?')
    .replace(/\s+abre(r)? (la )?interrogaci[oó]n\s+/gi, ' ¿')
    .replace(/\s+(signo de exclamaci[oó]n|cierra(r)? (la )?exclamaci[oó]n)\b/gi, '!')

/* ---------- Voz que lee el sueño (voces del propio iPhone) ---------- */
const canTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const TTS = { on: false };
function esVoices() { return canTTS ? speechSynthesis.getVoices().filter((v) => /^es([-_]|$)/i.test(v.lang)) : []; }
function pickVoice() {
  const vs = esVoices(); if (!vs.length) return null;
  if (DB.settings.voice) { const v = vs.find((x) => x.voiceURI === DB.settings.voice); if (v) return v; }
  const sc = (v) => (/(premium|mejorad|enhanced|neural|natural)/i.test(v.name) ? 4 : 0) + (/es[-_]ES/i.test(v.lang) ? 2 : 0) + (v.localService ? 1 : 0);
  return vs.slice().sort((a, b) => sc(b) - sc(a))[0];
}
function voiceOptions() {
  const vs = esVoices();
  return `<option value="">Automática</option>` + vs.map((v) => `<option value="${esc(v.voiceURI)}" ${DB.settings.voice === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
}
const rateLabel = (r) => ((r || 1) < 0.95 ? 'Lenta' : (r || 1) > 1.05 ? 'Rápida' : 'Normal') + ' · ' + (+(r || 1)).toFixed(2) + 'x';
function chunks(text) {
  const out = [];
  (String(text).replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]*\s*/g) || []).forEach((s) => {
    s = s.trim();
    while (s.length > 220) { let cut = s.lastIndexOf(',', 220); if (cut < 80) cut = s.lastIndexOf(' ', 220); if (cut < 40) cut = 220; out.push(s.slice(0, cut + 1)); s = s.slice(cut + 1).trim(); }
    if (s) out.push(s);
  });
  return out;
}
function speak(text, onEnd) {
  if (!canTTS) { toast('Este dispositivo no permite leer en voz alta'); if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const v = pickVoice(), parts = chunks(text); let i = 0;
  TTS.on = true;
  const next = () => {
    if (!TTS.on) return;
    if (i >= parts.length) { TTS.on = false; if (onEnd) onEnd(); return; }
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.lang = v ? v.lang : 'es-ES'; if (v) u.voice = v; u.rate = DB.settings.rate || 1; u.pitch = 1;
    u.onend = next; u.onerror = () => { TTS.on = false; if (onEnd) onEnd(); };
    speechSynthesis.speak(u);
  };
  next();
}
function stopSpeak() { TTS.on = false; if (canTTS) speechSynthesis.cancel(); setListenUI(false); }
function setListenUI(on) { const b = $('#listenBtn'); if (!b) return; b.classList.toggle('on', on); b.querySelector('.lt').textContent = on ? 'Parar' : 'Escuchar'; }
function dreamSpeech(d) { return [d.title + '.', ...(d.parts.length > 1 ? d.parts.map((p, i) => `Parte ${i + 1}. ${p.text}`) : [d.text])].join(' '); }

/* ---------- Avisos de pruebas de realidad (Calendario del iPhone) ---------- */
const RC_MSGS = ['¿Estás soñando?', 'Prueba de realidad', 'Mírate las manos', 'Tápate la nariz e intenta respirar'];
function rcTimes() {
  const { n, from, to } = DB.settings.rc; const span = Math.max(60, (to - from) * 60), step = span / n; let seed = 11;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  return Array.from({ length: n }, (_, i) => { const m = Math.round(from * 60 + step * i + step * (0.2 + 0.6 * rnd())); return [Math.floor(m / 60), m % 60]; });
}
const icsEsc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const icsFold = (l) => { const out = []; while (l.length > 70) { out.push(l.slice(0, 70)); l = ' ' + l.slice(70); } out.push(l); return out.join('\r\n'); };
function buildICS() {
  const t = new Date(), day = `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}`;
  const stamp = t.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const msg = DB.settings.rc.msg, desc = 'Prueba de realidad: tápate la nariz e intenta respirar y pregúntate en serio si estás soñando. (Sueños)';
  const ev = rcTimes().map(([h, m], i) => ['BEGIN:VEVENT', `UID:suenos-rc-${i}-${stamp}@suenos`, `DTSTAMP:${stamp}`, `DTSTART:${day}T${pad(h)}${pad(m)}00`, 'DURATION:PT1M', 'RRULE:FREQ=DAILY',
    `SUMMARY:${icsEsc(msg)}`, `DESCRIPTION:${icsEsc(desc)}`, 'TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(msg)}`, 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT'].map(icsFold).join('\r\n'));
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Suenos//Avisos//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', icsFold('X-WR-CALNAME:Sueños · pruebas de realidad'), ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
}
function rcFile() { return new File([buildICS()], 'suenos-avisos.ics', { type: 'text/calendar' }); }
function addReminders() {
  const url = URL.createObjectURL(new Blob([buildICS()], { type: 'text/calendar' }));
  DB.settings.rc.added = new Date().toISOString(); save();
  const w = window.open(url, '_blank');
  if (!w) location.href = url;
  setTimeout(() => openSheet(`<h2>Añadir avisos al Calendario</h2><p class="small">Si se ha abierto el Calendario, pulsa <b>Añadir todo</b>. Si no se ha abierto nada, comparte el archivo y elige <b>Calendario</b> (o guárdalo en Archivos y ábrelo desde ahí).</p><button class="btn primary block" data-act="shareRC">Compartir archivo de avisos</button><button class="btn ghost block" data-act="closeSheet" style="margin-top:8px">Hecho</button>`), 900);
}

/* ---------- PIN ---------- */
async function hashPin(p) {
  const s = 'suenos·' + p;
  if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16);
}
function padHTML() { return `<div class="dots">${'<i></i>'.repeat(4)}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-k="${n}">${n}</button>`).join('')}<button class="blank"></button><button data-k="0">0</button><button class="del" data-k="del" aria-label="Borrar">⌫</button></div>`; }
function bindPad(root, onDone) {
  let v = '';
  const dots = () => $$('.dots i', root).forEach((d, i) => d.classList.toggle('on', i < v.length));
  const reset = () => { v = ''; dots(); };
  $$('.pad button[data-k]', root).forEach((b) => {
    b.addEventListener('touchend', (e) => e.preventDefault(), { passive: false }); // evita el zoom por doble toque
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); press(b.dataset.k); });
  });
  function press(k) {
    if (k === 'del') v = v.slice(0, -1); else if (v.length < 4) v += k;
    dots();
    if (v.length === 4) { const val = v; setTimeout(() => onDone(val, () => { const d = $('.dots', root); d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 450); reset(); }, reset), 120); }
  }
}
let unlocked = false;
function showLock() {
  const L = $('#lock'); unlocked = false;
  L.innerHTML = `<div class="moon"></div><h2>Sueños</h2><p class="muted" style="margin:0">Introduce tu PIN</p>${padHTML()}<button class="linkbtn" id="forgot">¿Olvidaste el PIN?</button>`;
  L.hidden = false; document.body.classList.add('hide-tabs');
  bindPad(L, async (val, fail) => { if ((await hashPin(val)) === DB.settings.pinHash) { unlocked = true; L.hidden = true; document.body.classList.remove('hide-tabs'); if (importPending()) setTimeout(pasteSheet, 250); } else fail(); });
  $('#forgot').onclick = () => confirmSheet('¿Olvidaste el PIN?', 'Por seguridad, la única forma de quitarlo es <b>borrar todos los sueños</b> de este iPhone. Si tienes una copia exportada, podrás importarla después.', 'Borrar todo y quitar PIN', () => { localStorage.removeItem(KEY); load(); L.hidden = true; unlocked = true; document.body.classList.remove('hide-tabs'); route(); });
  // el sheet debe quedar por encima del bloqueo
  $('#sheet').style.zIndex = 90; $('#sheetBg').style.zIndex = 89;
}
function pinSetup() {
  let first = null;
  openSheet(`<h2 id="pinT">Nuevo PIN</h2><p class="muted small" id="pinS" style="margin:0">Elige 4 cifras</p><div style="display:flex;flex-direction:column;align-items:center">${padHTML()}</div>`);
  bindPad($('#sheet'), async (val, fail, reset) => {
    if (!first) { first = val; reset(); $('#pinT').textContent = 'Repite el PIN'; $('#pinS').textContent = 'Para confirmar'; return; }
    if (val !== first) { first = null; $('#pinT').textContent = 'No coinciden'; $('#pinS').textContent = 'Vuelve a elegir 4 cifras'; fail(); return; }
    DB.settings.pinHash = await hashPin(val); save(); closeSheet(); toast('PIN activado'); route();
  });
}

/* =========================================================
   ROUTER Y EVENTOS
   ========================================================= */
const ROUTES = { inicio: renderHome, nuevo: renderNew, diario: renderDiary, sueno: renderDetail, lucidos: renderLucid, ajustes: renderSettings };
const AFTER = { inicio: afterHome, nuevo: afterNew, diario: afterDiary, ajustes: afterSettings };
const ORDER = { inicio: 0, diario: 1, sueno: 1.5, nuevo: 2, lucidos: 3, ajustes: 4 };
let lastRoute = null;
function go(h, replace) { if (replace) location.replace(h); else location.hash = h; }
function route() {
  const parts = (location.hash || '#/inicio').replace(/^#\/?/, '').split('/');
  const name = ROUTES[parts[0]] ? parts[0] : 'inicio', arg = parts[1], arg2 = parts[2];
  if (rec.on) stopRec();
  if (TTS.on) stopSpeak();
  const v = $('#view');
  const dir = lastRoute == null || ORDER[name] === ORDER[lastRoute] ? 'enter' : ORDER[name] > ORDER[lastRoute] ? 'enter-r' : 'enter-l';
  v.classList.remove('enter', 'enter-r', 'enter-l'); v.innerHTML = ROUTES[name](arg, arg2); void v.offsetWidth; v.classList.add(dir);
  lastRoute = name;
  window.scrollTo(0, 0);
  if (AFTER[name]) AFTER[name](arg, arg2);
  $$('#tabbar a').forEach((a) => a.classList.toggle('on', a.dataset.tab === name || (name === 'sueno' && a.dataset.tab === 'diario')));
}
window.addEventListener('hashchange', route);

const ACT = {
  go: (el) => go(el.dataset.to),
  back: () => { if (history.length > 1) history.back(); else go('#/inicio'); },
  closeSheet,
  mic: () => (rec.on ? stopRec() : startRec()),
  focusText: () => { closeSheet(); setTimeout(() => { const t = activeTA(); if (t) t.focus(); }, 350); },
  lucid: (el) => { const p = F.parts[+el.dataset.i]; p.lucid = p.lucid === el.dataset.v ? null : el.dataset.v; el.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === p.lucid)); draftSoon(); },
  emo: (el) => {
    const i = +el.dataset.i, p = F.parts[i], v = el.dataset.v, on = !p.emotions.includes(v);
    p.emotions = on ? [...p.emotions, v] : p.emotions.filter((x) => x !== v);
    el.closest('.part').querySelectorAll(`.chips .chip[data-v="${v}"]`).forEach((c) => c.classList.toggle('on', on));
    const s = $('#sugg' + i); if (s) s.innerHTML = suggHTML(i); draftSoon();
  },
  theme: (el) => { const v = el.dataset.v; F.tagsTouched = true; F.tags = F.tags.includes(v) ? F.tags.filter((x) => x !== v) : [...F.tags, v]; el.classList.toggle('on', F.tags.includes(v)); draftSoon(); },
  addPart: () => {
    stopRec(); syncTexts();
    if (!F.parts[F.parts.length - 1].text.trim()) { F.active = F.parts.length - 1; refreshParts(); toast('Primero cuenta algo en la última parte'); return; }
    F.parts.push(newPart(F.date === dkey() ? new Date().toISOString() : null)); F.active = F.parts.length - 1; refreshParts(); draftSoon();
    setTimeout(() => { const el = $('.part.active'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
  },
  delPart: (el, e) => {
    e.stopPropagation(); stopRec(); syncTexts();
    const i = +el.dataset.i, doIt = () => { F.parts.splice(i, 1); F.active = Math.min(F.active, F.parts.length - 1); refreshParts(); draftSoon(); const th = $('#themes'); if (th) th.innerHTML = themesHTML(); };
    if (F.parts[i].text.trim()) confirmSheet('¿Quitar la parte ' + (i + 1) + '?', 'Se borrará lo que has escrito en ella.', 'Quitar', doIt); else doIt();
  },
  activePart: (el) => { stopRec(); syncTexts(); F.active = +el.dataset.i; refreshParts(); },
  saveDream, noDream,
  saveNone: (el) => saveNone(el.dataset.v),
  listen: (el) => { if (TTS.on) { stopSpeak(); return; } const d = DB.dreams[el.dataset.k]; if (!d) return; setListenUI(true); speak(dreamSpeech(d), () => setListenUI(false)); },
  testVoice: () => { if (TTS.on) { stopSpeak(); return; } speak('Hola' + (DB.name ? ' ' + DB.name : '') + '. Así sonará la voz que lee tus sueños.'); },
  addRC: addReminders, shareRC,
  toggleHealth: () => { DB.settings.health = !DB.settings.health; save(); route(); },
  toggleAuto: (el) => { DB.settings.autoImport = !DB.settings.autoImport; save(); el.classList.toggle('on', DB.settings.autoImport); },
  retryHealth: () => { closeSheet(); setTimeout(() => importHealth(DB.importTarget || dkey()), 300); },
  delDream: (el) => confirmSheet('¿Borrar este sueño?', 'No se puede deshacer.', 'Borrar', () => { delete DB.dreams[el.dataset.k]; save(); toast('Sueño borrado'); go('#/diario', true); }),
  filter: (el) => { diaryF = el.dataset.v; $$('.filters .chip').forEach((c) => c.classList.toggle('on', c.dataset.v === diaryF)); $('#list').innerHTML = diaryList(); },
  ltab: (el) => go('#/lucidos/' + el.dataset.v, true),
  task: (el) => {
    const k = dkey(), id = el.dataset.id;
    if (el.dataset.auto) { if (!DB.dreams[k]) { toast('Se marca solo al guardar el sueño de hoy'); go('#/nuevo'); } return; }
    DB.plan[k] = DB.plan[k] || {}; DB.plan[k][id] = !DB.plan[k][id]; save(); el.classList.toggle('on', DB.plan[k][id]);
    const ts = tasksFor(k); if (ts.every((t) => taskDone(k, t.id))) celebrate('¡Plan de hoy completo!');
  },
  addSign: () => { const i = $('#newSign'), v = i.value.trim().toLowerCase(); if (!v) return; if (!DB.signs.map(norm).includes(norm(v))) DB.signs.push(v); save(); route(); },
  markSign: (el) => { const v = el.dataset.w; if (!DB.signs.map(norm).includes(norm(v))) DB.signs.push(v); save(); toast('Añadida a tus señales'); route(); },
  delSign: (el) => { DB.signs.splice(+el.dataset.i, 1); save(); route(); },
  importHealth, pasteHealth,
  parsePasted: () => handleHealthText($('#pasteArea').value),
  export: exportData,
  import: () => $('#fileIn').click(),
  wipe: () => confirmSheet('¿Borrar todo?', 'Se eliminarán todos tus sueños, datos de sueño y ajustes de este iPhone. Exporta una copia antes si quieres conservarlos.', 'Borrar todo', () => { localStorage.removeItem(KEY); load(); DB.welcomed = true; save(); toast('Datos borrados'); go('#/inicio'); route(); }),
  pinSet: pinSetup,
  pinOff: () => confirmSheet('¿Quitar el PIN?', 'La app se abrirá sin pedir código.', 'Quitar PIN', () => { DB.settings.pinHash = null; save(); toast('PIN quitado'); route(); }),
  obNext: () => { const n = $('#obName'); DB.name = n ? n.value.trim().slice(0, 24) : DB.name; save(); obGo(1); },
  obSkipPin: () => obGo(2),
  obHealth: (el) => { DB.settings.health = el.dataset.v === '1'; save(); obGo(3); },
  obRC: (el) => { DB.settings.rc.wanted = el.dataset.v === '1'; save(); obGo(4); },
  welcomeOk: () => { DB.welcomed = true; save(); closeSheet(); route(); },
  welcomeSetup: () => { DB.welcomed = true; save(); closeSheet(); go('#/ajustes'); },
  welcomeRC: () => { DB.welcomed = true; save(); closeSheet(); setTimeout(addReminders, 350); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
// Escribir y pulsar Enter en "añadir señal"
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'newSign') ACT.addSign(); });

/* ---------- Sin zoom: que se sienta como una app ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* ---------- Bienvenida (primera vez) ---------- */
const obDots = (i) => `<div class="ob-dots">${[0, 1, 2, 3, 4].map((x) => `<i class="${x === i ? 'on' : ''}"></i>`).join('')}</div>`;
function showWelcome() {
  openSheet(`${obDots(0)}<h2>Bienvenido a Sueños</h2><p>Tu diario para recordar tus sueños y aprender a tener sueños lúcidos.</p><label class="field"><span>¿Cómo te llamas?</span><input class="input" id="obName" maxlength="24" placeholder="Tu nombre" autocomplete="given-name"></label><button class="btn primary big block" data-act="obNext">Continuar</button>`);
}
function obGo(i) {
  if (i === 1) {
    if (DB.settings.pinHash) return obGo(2);
    let first = null;
    openSheet(`${obDots(1)}<h2 id="pinT">¿Proteger tus sueños con un PIN?</h2><p class="small" id="pinS" style="margin:0 0 4px">Opcional. Se pedirá al abrir la app y puedes quitarlo cuando quieras en Ajustes. Elige 4 cifras o pulsa Saltar.</p><div style="display:flex;flex-direction:column;align-items:center">${padHTML()}</div><button class="btn ghost block" data-act="obSkipPin" style="margin-top:14px;border-color:var(--stroke);color:var(--muted)">Saltar</button>`);
    bindPad($('#sheet'), async (val, fail, reset) => {
      if (!first) { first = val; reset(); $('#pinT').textContent = 'Repite el PIN'; $('#pinS').textContent = 'Para confirmar'; return; }
      if (val !== first) { first = null; $('#pinT').textContent = 'No coinciden'; $('#pinS').textContent = 'Vuelve a elegir 4 cifras'; fail(); return; }
      DB.settings.pinHash = await hashPin(val); save(); toast('PIN activado'); obGo(2);
    });
  } else if (i === 2) {
    openSheet(`${obDots(2)}<h2>¿Usas reloj o pulsera para dormir?</h2><p class="small">Si tu Apple Watch, Amazfit u otra pulsera guarda el sueño en la app Salud, Sueños puede mostrar tus fases (REM, profundo…) debajo de cada sueño. Es opcional: la app funciona igual sin nada.</p><div style="display:grid;gap:10px;margin-top:16px"><button class="btn primary big block" data-act="obHealth" data-v="1">Sí, quiero usar Salud</button><button class="btn big block" data-act="obHealth" data-v="0">No, ahora no</button></div>`);
  } else if (i === 3) {
    openSheet(`${obDots(3)}<h2>¿Avisos para hacer pruebas de realidad?</h2><p class="small">Unos pocos avisos durante el día para preguntarte "¿estoy soñando?". Se añaden al Calendario del iPhone y puedes cambiarlos o quitarlos cuando quieras.</p><div style="display:grid;gap:10px;margin-top:16px"><button class="btn primary big block" data-act="obRC" data-v="1">Sí, quiero avisos</button><button class="btn big block" data-act="obRC" data-v="0">No, ahora no</button></div>`);
  } else {
    const extra = [DB.settings.health ? '<button class="btn big" data-act="welcomeSetup">Configurar Salud</button>' : '', DB.settings.rc.wanted ? '<button class="btn big" data-act="welcomeRC">Añadir avisos</button>' : ''].filter(Boolean);
    openSheet(`${obDots(4)}<h2>Todo listo${DB.name ? ', ' + esc(DB.name) : ''}</h2><ol class="steps"><li>Cada mañana, nada más despertar, toca el <b>micro</b> y cuenta tu sueño.</li><li>Si te despiertas varias veces, añade cada trozo como una <b>parte</b>.</li><li>¿No recuerdas nada? Márcalo igual: el hábito es lo que importa.</li><li>Sigue el <b>plan diario</b> de la pestaña Lúcidos.</li></ol>${extra.length ? `<div class="grid2" style="margin-bottom:10px">${extra.join('')}</div>` : ''}<button class="btn primary big block" data-act="welcomeOk">Empezar</button>`);
  }
}

/* ---------- Ciclo de vida ---------- */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (rec.on) stopRec(); if (TTS.on) stopSpeak(); return; }
  if ((location.hash || '#/inicio').startsWith('#/inicio')) route(); // refresca saludo/fecha si cambió el día
  if (DB.settings.pinHash && hiddenAt && Date.now() - hiddenAt > 3 * 60 * 1000) showLock();
  else if (importPending()) setTimeout(pasteSheet, 250);
  sky.start();
});

/* ---------- Cielo estrellado ---------- */
const sky = (() => {
  const c = $('#sky'), x = c.getContext('2d'); let W, H, stars = [], raf = 0, last = 0, shoot = null;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.min(160, Math.round((W * H) / 4200)) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.15 + 0.25, p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.4 }));
  }
  function draw(t) {
    x.clearRect(0, 0, W, H);
    for (const s of stars) { x.globalAlpha = 0.25 + 0.7 * Math.abs(Math.sin(s.p + (t / 1000) * s.s * 0.5)); x.fillStyle = '#d6e4ff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); }
    if (!shoot && Math.random() < 0.0025) shoot = { x: Math.random() * W * 0.7 + W * 0.2, y: Math.random() * H * 0.35, l: 0 };
    if (shoot) {
      shoot.l += 0.022; const p = shoot.l, len = 110;
      const sx = shoot.x - p * 260, sy = shoot.y + p * 130;
      const g = x.createLinearGradient(sx, sy, sx + len, sy - len / 2); g.addColorStop(0, 'rgba(220,235,255,.9)'); g.addColorStop(1, 'rgba(220,235,255,0)');
      x.globalAlpha = Math.sin(Math.PI * Math.min(1, p)); x.strokeStyle = g; x.lineWidth = 1.6; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + len, sy - len / 2); x.stroke();
      if (p >= 1) shoot = null;
    }
    x.globalAlpha = 1;
  }
  function loop(t) { raf = 0; if (document.hidden) return; if (t - last > 40) { draw(t); last = t; } raf = requestAnimationFrame(loop); }
  addEventListener('resize', () => { size(); if (reduce) draw(0); });
  size();
  return { start() { if (reduce) { draw(0); return; } if (!raf) raf = requestAnimationFrame(loop); } };
})();

/* ---------- Inicio ---------- */
load();
if (!location.hash) location.replace('#/inicio');
route();
sky.start();
if (DB.welcomed && DB.settings.pinHash) showLock();
// Pantalla de carga
setTimeout(() => { const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 600); } }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 950);
if (!DB.welcomed) setTimeout(showWelcome, 1250);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
